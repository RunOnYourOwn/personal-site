name: Rollback Deployment

# Rollback to a previous version without rebuilding
# Uses existing image from GHCR and triggers Portainer redeploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rollback to (e.g., 2.0.3)'
        required: true
        type: string
      reason:
        description: 'Reason for rollback (for audit trail)'
        required: false
        type: string
        default: 'Manual rollback'

permissions:
  contents: read
  packages: read

# Prevent multiple rollbacks from running simultaneously
concurrency:
  group: rollback-deployment
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback to v${{ github.event.inputs.version }}
    runs-on: [self-hosted, Linux]
    steps:
      - name: Validate version format
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid version format. Use semantic versioning (e.g., 2.0.3)"
            exit 1
          fi
          echo "Rolling back to version: $VERSION"
          echo "Reason: ${{ github.event.inputs.reason }}"

      - name: Check if image exists in GHCR
        run: |
          VERSION="${{ github.event.inputs.version }}"
          IMAGE="ghcr.io/runonyourown/personal-site:v${VERSION}"

          echo "Checking for image: $IMAGE"

          # Try to pull the image manifest (doesn't download layers)
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Image found: $IMAGE"
          else
            echo "Error: Image not found in registry: $IMAGE"
            echo "Available tags can be viewed at: https://github.com/RunOnYourOwn/personal-site/pkgs/container/personal-site"
            exit 1
          fi

      - name: Trigger Portainer Rollback
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          VERSION="${{ github.event.inputs.version }}"

          if [ -z "$PORTAINER_URL" ] || [ -z "$API_KEY" ]; then
            echo "Error: PORTAINER_URL or PORTAINER_API_KEY not configured"
            exit 1
          fi

          echo "Triggering Portainer to pull v${VERSION}..."

          # Trigger redeploy with the specific version
          response=$(curl -s -w "\n%{http_code}" -X PUT "$PORTAINER_URL" \
            -H "X-API-Key: $API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"pullImage": true}')

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Rollback triggered successfully"
          else
            echo "Error: Rollback failed with HTTP $http_code"
            echo "Response: $body"
            exit 1
          fi

      - name: Verify rollback
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 30

          # Note: Add your production URL health check here
          # Example:
          # curl -sf https://aaronbrazier.com/healthz || echo "Warning: Health check failed"

          echo "Rollback to v${{ github.event.inputs.version }} complete"
          echo ""
          echo "IMPORTANT: Update your docker-compose or Portainer stack to pin this version"
          echo "if you want to prevent auto-updates from overwriting this rollback."

      - name: Create rollback record
        run: |
          echo "=== ROLLBACK RECORD ==="
          echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "Version: v${{ github.event.inputs.version }}"
          echo "Reason: ${{ github.event.inputs.reason }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "======================="
