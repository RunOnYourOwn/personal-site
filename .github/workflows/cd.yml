name: CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy without version check'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-tag:
    name: Check Version and Create Tag
    runs-on: [self-hosted, Linux]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      should-deploy: ${{ steps.check-version.outputs.should-deploy }}
      version: ${{ steps.check-version.outputs.version }}
    steps:
      - name: Pre-checkout cleanup
        run: |
          echo "Cleaning workspace before checkout..."
          rm -rf $GITHUB_WORKSPACE/* || true
          rm -rf $GITHUB_WORKSPACE/.git || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Check for version changes
        id: check-version
        run: |
          # Get current version from VERSION file
          CURRENT_VERSION=$(cat VERSION | tr -d ' \t\n\r')
          echo "Current version: $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # Check for force deploy
          if [ "${{ github.event.inputs.force_deploy }}" == "true" ]; then
            echo "Force deploy requested - bypassing version check"
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          # Check if tag already exists
          elif git tag -l | grep -q "^v$CURRENT_VERSION$"; then
            echo "Tag v$CURRENT_VERSION already exists, skipping deployment"
            echo "should-deploy=false" >> $GITHUB_OUTPUT
          else
            echo "New version detected: $CURRENT_VERSION"
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.check-version.outputs.should-deploy == 'true'
        run: |
          VERSION="${{ steps.check-version.outputs.version }}"
          TAG_NAME="v$VERSION"

          # Skip tag creation if it already exists (force deploy case)
          if git tag -l | grep -q "^$TAG_NAME$"; then
            echo "Tag $TAG_NAME already exists, skipping tag creation"
            exit 0
          fi

          # Create annotated tag
          git tag -a "$TAG_NAME" -m "Release version $VERSION"

          # Push tag
          git push origin "$TAG_NAME"

          echo "Created and pushed tag: $TAG_NAME"

      - name: Cleanup workspace
        if: always()
        run: |
          echo "Cleaning up workspace for self-hosted runner..."
          rm -rf $GITHUB_WORKSPACE/*

  publish:
    name: Build and Publish to GHCR
    needs: check-and-tag
    runs-on: [self-hosted, Linux]
    if: |
      always() && (
        (github.event_name == 'push' && needs.check-and-tag.outputs.should-deploy == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    steps:
      - name: Pre-checkout cleanup
        run: |
          echo "Cleaning workspace before checkout..."
          rm -rf $GITHUB_WORKSPACE/* || true
          rm -rf $GITHUB_WORKSPACE/.git || true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d ' \t\n\r')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
          tags: |
            ghcr.io/runonyourown/personal-site:latest
            ghcr.io/runonyourown/personal-site:${{ github.sha }}
            ghcr.io/runonyourown/personal-site:v${{ steps.version.outputs.version }}

      - name: Generate Release Notes
        id: release_notes
        run: |
          # Get the previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            # First release - get all commits
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            # Get commits since previous tag
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges ${PREVIOUS_TAG}..HEAD)
          fi

          # Create release body
          cat > release_body.md << EOF
          ## Personal Site v${{ steps.version.outputs.version }}

          ### Docker Images
          - \`ghcr.io/runonyourown/personal-site:v${{ steps.version.outputs.version }}\`
          - \`ghcr.io/runonyourown/personal-site:latest\`

          ### Changes
          $COMMITS

          ### Deployment
          This release is automatically deployed to production via Portainer webhook.
          EOF

          # Output the release body
          echo "release_body<<EOF" >> $GITHUB_OUTPUT
          cat release_body.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: release_body.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up Docker resources
        if: always()
        run: |
          echo "Cleaning up Docker resources..."
          docker system prune -f --volumes || true

      - name: Cleanup workspace
        if: always()
        run: |
          echo "Cleaning up workspace for self-hosted runner..."
          rm -rf $GITHUB_WORKSPACE/*

  deploy:
    name: Deploy to Production
    needs: [check-and-tag, publish]
    runs-on: [self-hosted, Linux]
    if: needs.publish.result == 'success'
    steps:
      - name: Trigger Portainer webhook
        run: |
          echo "Triggering Portainer deployment webhook..."
          curl -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            --fail --silent --show-error
          echo "Deployment triggered successfully"

      - name: Verify deployment
        run: |
          echo "Waiting for deployment to complete..."
          sleep 30

          # Check if site is responding
          for i in {1..6}; do
            if curl -sf https://aaronbrazier.com/healthz > /dev/null 2>&1; then
              echo "Site is healthy after deployment"
              exit 0
            fi
            echo "Attempt $i: Site not ready yet, waiting..."
            sleep 10
          done

          echo "Warning: Site health check timed out, but deployment may still be in progress"
