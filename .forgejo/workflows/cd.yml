# CD — build the site image on a version bump, push to the private container
# registry (deploy source of truth) + a public mirror, then bump the image tag
# in the deploy repo so the orchestrator redeploys (GitOps).
#
# Host/repo/registry specifics are kept out of this (publicly-mirrored) file via
# Forgejo Actions variables:
#   vars.REGISTRY_HOST   private container registry host
#   vars.IMAGE_PATH      <namespace>/<image>
#   vars.REGISTRY_USER   registry login user
#   vars.DEPLOY_REPO     <namespace>/<repo> holding the deploy compose
# Secrets (set in repo settings):
#   REGISTRY_TOKEN       registry login (package:write) for the private registry
#   GHCR_TOKEN           GitHub PAT (write:packages) for the public mirror push
#   HOMELAB_APPS_TOKEN   token with write to the deploy repo (GitOps tag bump)

name: CD
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Build + push even if the version tag already exists'
        type: boolean
        default: false

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false # never cancel a deploy mid-flight

env:
  REGISTRY_IMAGE: ${{ vars.REGISTRY_HOST }}/${{ vars.IMAGE_PATH }}
  GHCR_IMAGE: ghcr.io/${{ vars.IMAGE_PATH }}

jobs:
  build-deploy:
    runs-on: homelab-infra
    steps:
      - name: Bootstrap (node for JS actions + git)
        run: |
          set -euo pipefail
          command -v node >/dev/null 2>&1 || { apt-get update -q && apt-get install -y -q nodejs; }
          command -v git  >/dev/null 2>&1 || { apt-get update -q && apt-get install -y -q git; }

      - name: Checkout
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version + whether to build
        id: ver
        run: |
          set -euo pipefail
          V=$(tr -d ' \t\n\r' < VERSION)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif git tag -l | grep -qx "v$V"; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice ::v$V already tagged — nothing to deploy"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to the private registry
        if: steps.ver.outputs.build == 'true'
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "${{ vars.REGISTRY_HOST }}" -u "${{ vars.REGISTRY_USER }}" --password-stdin

      - name: Build + push to the private registry (deploy source of truth)
        if: steps.ver.outputs.build == 'true'
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          docker build \
            --build-arg VERSION="$V" \
            --build-arg VCS_REF="${{ github.sha }}" \
            -t "$REGISTRY_IMAGE:v$V" -t "$REGISTRY_IMAGE:latest" .
          docker push "$REGISTRY_IMAGE:v$V"
          docker push "$REGISTRY_IMAGE:latest"

      - name: Mirror image to GHCR (public, best-effort)
        if: steps.ver.outputs.build == 'true'
        continue-on-error: true # a mirror hiccup must never block the deploy
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ vars.REGISTRY_USER }}" --password-stdin
          docker tag "$REGISTRY_IMAGE:v$V" "$GHCR_IMAGE:v$V"
          docker tag "$REGISTRY_IMAGE:latest" "$GHCR_IMAGE:latest"
          docker push "$GHCR_IMAGE:v$V"
          docker push "$GHCR_IMAGE:latest"

      - name: Tag the release in this repo
        if: steps.ver.outputs.build == 'true'
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          git config user.name  "forgejo-actions"
          git config user.email "forgejo-actions@noreply.local"
          git tag -a "v$V" -m "Release v$V" || true
          git push origin "v$V" || true

      - name: GitOps — bump image tag in the deploy repo (triggers redeploy)
        if: steps.ver.outputs.build == 'true'
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          rm -rf _deploy && git clone --depth 1 \
            "https://forgejo-actions:${{ secrets.HOMELAB_APPS_TOKEN }}@${{ vars.REGISTRY_HOST }}/${{ vars.DEPLOY_REPO }}.git" _deploy
          cd _deploy
          F="apps/personal-site/compose.yaml"
          sed -i -E "s|(image: ${{ vars.REGISTRY_HOST }}/${{ vars.IMAGE_PATH }}:)[^[:space:]]+|\1v$V|" "$F"
          if git diff --quiet "$F"; then
            echo "deploy compose already at v$V — no bump needed"
          else
            git config user.name  "forgejo-actions"
            git config user.email "forgejo-actions@noreply.local"
            git commit -qm "chore(personal-site): deploy v$V" "$F"
            git push origin main
            echo "bumped personal-site → v$V"
          fi

      - name: Cleanup
        if: always()
        run: docker image prune -f >/dev/null 2>&1 || true
